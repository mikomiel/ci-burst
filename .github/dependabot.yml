version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # boto3 pins botocore and s3transfer to its own release line, so the
      # hash-locked CI file only resolves when the three move together.
      aws-sdk:
        patterns:
          - boto3
          - botocore
          - s3transfer
      python-development-dependencies:
        dependency-type: development
