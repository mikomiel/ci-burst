# Drop-in for a cleanup host whose podman networking has no egress.
#
# The shipped `ci-burst-reap.service` runs on the named `ci-burst` network. Some
# hosts cannot: podman's bridge subnets exist without a route or NAT rule,
# because another container runtime on the same host owns that job. `reap` calls
# only AWS — no inbound traffic, no Forgejo, no published port — so host
# networking is sufficient there.
#
# Install it beside the unit, and set the refresh smoke to the same network:
#
#   install -d -m 0755 /etc/systemd/system/ci-burst-reap.service.d
#   install -m 0644 deploy/ci-burst-reap-host-network.conf \
#     /etc/systemd/system/ci-burst-reap.service.d/host-network.conf
#   systemctl daemon-reload
#
# Then `Environment=CI_BURST_SMOKE_NETWORK=host` in the refresh drop-in is the
# matching value; on a host that keeps the shipped unit, the smoke stays on
# `ci-burst`. Remove both drop-ins as soon as the host's podman networking
# works, so the deployed unit is the shipped one again.
[Service]
ExecStart=
ExecStart=/usr/bin/podman run --rm --replace --init --network=host --name ci-burst-reap \
    --read-only \
    --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
    --volume /etc/ci-burst/deployment.toml:/etc/ci-burst/deployment.toml:ro \
    --volume /etc/ci-burst/aws-cleanup:/etc/ci-burst/aws:ro \
    localhost/ci-burst:latest reap --apply --config /etc/ci-burst/deployment.toml
