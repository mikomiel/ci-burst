title = "ci-burst public-content policy"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Do not publish private deployment IPv4 addresses"
regex = '''\b(?:10\.(?:[0-9]{1,3}\.){2}[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})\b'''

[[rules]]
id = "private-dns-name"
description = "Do not publish internal deployment DNS names"
# The leading (?:^|[^\w])(?:\w+/)? consumes the preceding context into the
# match: any single non-word char (including a dot, so wildcard and SRV-style
# names still match after their dots) plus an optional word/ path segment.
# The hostname itself is capture group 1.
regex = '''(?i)(?:^|[^\w])(?:\w+/)?((?:[a-z0-9](?:[a-z0-9-]*[a-z0-9])?\.)+(?:internal|lan|local))\b'''
secretGroup = 1
  # Only the exact dot-prefixed dotenv filename match is exempt; wildcard
  # and service-discovery (SRV) DNS names still match with their leading
  # dot and are still flagged.
  [[rules.allowlists]]
  description = "Only the exact dot-prefixed dotenv filename match is exempt"
  regexTarget = "match"
  regexes = ['''^\.env\.local$''']
  # Prose (space, quote or backtick before it) and path-style (word/ before
  # it) mentions of the bare dotenv word are not hostnames and are exempted
  # here. URL (`http://...`, match keeps a bare `/` prefix) and assignment
  # (`HOST=...`, match keeps the `=` prefix) uses are still flagged.
  [[rules.allowlists]]
  description = "Prose and path-style mentions of the dotenv word are not hostnames; URL and assignment uses still flag"
  regexTarget = "match"
  regexes = [
    '''(?i)(?:^|[\s"'`])env\.local$''',
    '''(?i)\w+/env\.local$''',
  ]
