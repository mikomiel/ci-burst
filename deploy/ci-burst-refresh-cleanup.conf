# Drop-in for a cleanup-only host.
#
# The same refresh unit installs the image on both hosts; only the smoke differs,
# because the scheduled unit on this host is `reap` rather than `apply`. Install
# it beside the unit:
#
#   install -d -m 0755 /etc/systemd/system/ci-burst-refresh.service.d
#   install -m 0644 deploy/ci-burst-refresh-cleanup.conf \
#     /etc/systemd/system/ci-burst-refresh.service.d/cleanup.conf
#   systemctl daemon-reload
#
# Each override exists for a reason the reaper host cannot avoid:
#   * `reap` without `--apply` is the smoke: it reads this host's configuration,
#     reaches the cleanup identity and selects nothing to terminate. `plan` is
#     not usable here because the reaper holds no Forgejo token, and giving it one
#     would widen a credential boundary the reaper is deliberately outside of.
#   * the cleanup credentials mount where the scaling credentials mount on the
#     controller host; the image always looks in /etc/ci-burst/aws.
#   * an empty token path makes the script drop `--env-file` instead of failing
#     on a file this host must not have.
#   * host networking matches the reap unit, because this host has no named
#     ci-burst network.
#   * the drift report compares this host's own units, so the controller's apply
#     and refresh units are not reported as missing on every run.
[Service]
Description=Build the current ci-burst main as the reaper image
Environment=CI_BURST_AWS_DIR=/etc/ci-burst/aws-cleanup
Environment=CI_BURST_SMOKE_COMMAND=reap
Environment=CI_BURST_SMOKE_NETWORK=host
Environment=CI_BURST_TOKEN_ENV=
Environment=CI_BURST_UNITS=ci-burst-reap.service ci-burst-reap.timer
