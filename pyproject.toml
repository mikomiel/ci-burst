[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-burst"
version = "0.1.0"
description = "Bounded AWS Spot runner capacity for one Forgejo repository queue"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "ci-burst maintainers" }]
dependencies = ["boto3>=1.34,<2"]

[project.scripts]
ci-burst = "ci_burst.cli:main"

[tool.setuptools]
packages = ["ci_burst"]
