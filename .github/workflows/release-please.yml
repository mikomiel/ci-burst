# Release automation under the repository's own merge policy: release-please
# opens one release pull request on a release-relevant conventional commit, and
# merging that pull request is the maintainer's release decision. The release
# pull request always changes a sensitive path (pyproject.toml,
# ci_burst/__init__.py or the manifest), so scripts/pr_policy.py never
# auto-merges it.
#
# `automerge` calls this workflow when its own run landed a pull request, so a
# sweep or a gate pass that merges nothing costs no release run. `push` keeps the
# path for a merge performed with a token that does create push events.
# `workflow_run` is not a trigger here: it fires on every completion of the
# automation, whether or not that run merged anything. `workflow_dispatch` is the
# manual reconciliation path and is accepted only from the default branch, so a
# branch's copy of this privileged workflow never runs against the secret.
#
# The token is a fine-grained personal access token with Contents: write and
# Pull requests: write on this repository, stored as RELEASE_PLEASE_TOKEN. The
# default GITHUB_TOKEN cannot be used: a pull request it creates does not
# trigger the pull-request workflows, so the required checks would never run.
# The ambient GITHUB_TOKEN is therefore read-only; the action writes only with
# the personal token.
name: release-please

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: >-
      github.event_name != 'workflow_dispatch'
      || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
